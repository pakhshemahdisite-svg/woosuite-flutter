name: WooSuite Flutter APK (private source)
run-name: "WooSuite Android build • ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Sign and upload updateable release APK using the permanent keystore'
        type: boolean
        default: false
        required: true
      release_version:
        description: 'New version name (production signing opt-in only)'
        type: string
        default: '0.9.2'
        required: true
      release_code:
        description: 'Higher Android versionCode (first permanent release: 2024)'
        type: number
        default: 2030
        required: true
  push:
    branches: [main, build/woosuite-w-launcher-icon-20261106]
    paths:
      - '.ci/build-request.txt'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: woosuite-flutter-private-source
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK from private repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check private checkout credential
        env:
          SOURCE_TOKEN: ${{ secrets.WOOSUITE_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Configure Actions secret WOOSUITE_SOURCE_READ_TOKEN (fine-grained PAT, read-only contents of woosuite-flutter-source)."
            exit 1
          fi

      - name: Fetch private WooSuite source
        uses: actions/checkout@v4
        with:
          repository: pakhshemahdisite-svg/woosuite-flutter-source
          ref: feature/woosuite-w-launcher-icon-20261106
          token: ${{ secrets.WOOSUITE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Validate private WooSuite Sales Reports PHP module
        run: |
          php -l private-source/modules/ab-woosuite-sales-reports/ab-woosuite-sales-reports.php
          php -l private-source/modules/ab-woosuite-sales-reports/includes/class-abwsr-sales-report.php
          php -l private-source/modules/ab-woosuite-sales-reports/tests/smoke.php
          php private-source/modules/ab-woosuite-sales-reports/tests/smoke.php

      - name: Test private WooSuite Audit PHP module
        shell: bash
        run: |
          php -l private-source/modules/ab-woosuite-audit/ab-woosuite-audit/ab-woosuite-audit.php
          php -l private-source/modules/ab-woosuite-audit/ab-woosuite-audit/includes/class-abws-audit.php
          php private-source/modules/ab-woosuite-audit/tests/audit.php

      - name: Validate WooSuite Mobile Integrations REST contract
        run: |
          php -l private-source/modules/ab-woosuite-mobile-integrations/ab-woosuite-mobile-integrations.php
          php -l private-source/modules/ab-woosuite-mobile-integrations/includes/class-abws-mobile-realtime.php
          php -l private-source/modules/ab-woosuite-mobile-integrations/includes/class-abws-mobile-monitor.php
          php -l private-source/modules/ab-woosuite-mobile-integrations/tests/realtime-contracts.php
          php -l private-source/modules/ab-woosuite-mobile-integrations/includes/class-abws-mobile-admin.php
          php -l private-source/modules/ab-woosuite-mobile-integrations/tests/admin-voice-activation-contracts.php
          php private-source/modules/ab-woosuite-mobile-integrations/tests/contracts.php
          php private-source/modules/ab-woosuite-mobile-integrations/tests/realtime-contracts.php
          php private-source/modules/ab-woosuite-mobile-integrations/tests/admin-voice-activation-contracts.php

      - name: Test permanent Android signing logic without any real keys
        run: python3 private-source/ci/test_release_signing.py

      - name: Restore Flutter project without publishing source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          src = Path("private-source/source.zip")
          if not src.is_file():
              raise SystemExit("Private repository must contain source.zip at root")
          root = Path("app").resolve()
          root.mkdir(parents=True, exist_ok=True)
          with ZipFile(src) as z:
              names = [m.filename for m in z.infolist() if not m.is_dir()]
              if not names:
                  raise SystemExit("Source archive is empty")
              prefix = "ab-woosuite-manager-flutter/" if all(n.startswith("ab-woosuite-manager-flutter/") for n in names) else ""
              for entry in z.infolist():
                  if entry.is_dir():
                      continue
                  rel = entry.filename[len(prefix):]
                  dest = (root / rel).resolve()
                  if not rel or not dest.is_relative_to(root) or (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit("Unsafe ZIP path or symlink detected")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(entry))
          if not (root / "pubspec.yaml").is_file():
              raise SystemExit("Missing pubspec.yaml in private Flutter source")
          print("Private source imported into temporary runner workspace")
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        working-directory: app
        run: flutter create --platforms=android --project-name=ab_woosuite_manager --org=com.amirbakhshi .

      - name: Apply compatibility fixes from private source
        run: python3 private-source/ci/apply_build_fixes.py

      - name: Set up Python for private branding assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font and image build tools
        run: python -m pip install --disable-pip-version-check pillow 'fonttools[woff]'

      - name: Apply branded icon, splash and YekanBakh fonts
        run: python private-source/ci/apply_branding_072.py

      - name: Apply order details feature and regression tests
        run: python3 private-source/ci/apply_features_073.py

      - name: Apply WooSuite 0.7.4 product details and variation management
        run: python3 private-source/ci/apply_features_074.py

      - name: Apply WooSuite 0.7.5 inventory summary and stock filtering
        run: python3 private-source/ci/apply_features_075.py

      - name: Apply WooSuite 0.7.6 read-only connectivity diagnostics
        run: python3 private-source/ci/apply_features_076.py

      - name: Apply WooSuite 0.7.7 sales reports UI and tests
        run: python3 private-source/ci/apply_features_077.py

      - name: Apply WooSuite v0.7.8 read-only activity timeline
        run: python3 private-source/ci/apply_features_078.py

      - name: Apply WooSuite v0.7.9 independent audit API integration
        run: python3 private-source/ci/apply_features_079.py

      - name: Apply WooSuite v0.8.0 audit filter and timeline UI
        run: python3 private-source/ci/apply_features_080.py

      - name: Apply WooSuite v0.8.1 Smart Hub integration
        run: python3 private-source/ci/apply_features_081.py

      - name: Apply WooSuite v0.8.2 consented AI conversation
        run: python3 private-source/ci/apply_features_082.py

      - name: Apply AB Smart Suite v0.8.3 real chat, voice and confirmed actions
        run: python3 private-source/ci/apply_features_083.py

      - name: Apply WooSuite v0.8.4 app appearance and developer screen
        run: python3 private-source/ci/apply_features_084.py

      - name: Apply v0.8.5 guarded mobile WebRTC audio client
        run: python3 private-source/ci/apply_features_085.py

      - name: Apply v0.8.6 Persian conversational voice assistant
        run: python3 private-source/ci/apply_features_086.py

      - name: Apply v0.8.7 polished UI and Assistant voice navigation
        run: python3 private-source/ci/apply_features_087.py

      - name: Apply v0.8.8 OpenAI real-time voice and developer contact corrections
        run: python3 private-source/ci/apply_features_088.py

      - name: Apply v0.8.9 stable Android microphone and WebRTC crash guards
        run: python3 private-source/ci/apply_features_089.py

      - name: Apply WooSuite v0.9.1 lifecycle and RTL navigation overlay
        run: python3 private-source/ci/apply_features_090.py

      - name: Apply WooSuite v0.9.2 unified Smart Suite voice overlay
        run: python3 private-source/ci/apply_features_092.py

      - name: Replace ONLY the Android launcher with the uploaded gold/silver W
        run: python3 private-source/ci/apply_launcher_w_icon.py

      - name: Configure microphone and voice service permissions
        run: python3 private-source/scripts/configure_voice_platforms.py app

      - name: Verify expected Flutter app version and native microphone setup
        run: |
          grep -Fxq 'version: 0.9.2+29' app/pubspec.yaml
          grep -Fq 'android.permission.RECORD_AUDIO' app/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' app/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.ACCESS_NETWORK_STATE' app/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.CHANGE_NETWORK_STATE' app/android/app/src/main/AndroidManifest.xml
          grep -Fq 'permission_handler: 12.0.3' app/pubspec.yaml

      - name: Allow HTTPS connectivity
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perm='<uses-permission android:name="android.permission.INTERNET" />'
          if perm not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    '+perm)
              p.write_text(s)
          PY

      - name: Install Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze code
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Execute tests
        working-directory: app
        run: flutter test

      - name: Build signed debug APK (testing only)
        working-directory: app
        run: flutter build apk --debug

      - name: Verify and package debug APK first
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Publish DEBUG-signed test APK (NOT updateable)
        uses: actions/upload-artifact@v4
        with:
          name: WooSuite-Pro-0.9.2-W-Launcher-DEBUG-Test
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Isolate preview APK from the installed WooSuite production package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.signed_release != true }}
        run: python3 private-source/scripts/configure_android_preview.py app

      - name: Build optimized ARM64 release-mode APK (optional)
        id: arm64
        working-directory: app
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee arm64-build.log

      - name: Export ARM64 diagnostic logs on failure
        if: steps.arm64.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: WooSuite-Manager-ARM64-Release-Diagnostics
          path: app/arm64-build.log
          retention-days: 3

      - name: Verify ARM64 and SHA-256
        if: steps.arm64.outcome == 'success'
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk > app-arm64-v8a-release.apk.sha256

      - name: Verify preview Android package identity before publication
        if: ${{ steps.arm64.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.signed_release != true) }}
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt_path"
          "$aapt_path" dump badging "$apk" | grep -Fq "package: name='com.amirbakhshi.ab_woosuite_manager.preview'"

      - name: Publish isolated ARM64 Preview test APK (install beside current app)
        if: steps.arm64.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WooSuite-Pro-0.9.2-W-Launcher-ARM64-Preview
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          retention-days: 7

      # This stage NEVER runs on pushes, only on explicit manual approvals.
      # GitHub encrypted secrets are required; a missing/wrong cert is fatal.
      - name: Create APK with permanent release identity (opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release == true }}
        env:
          WOOSUITE_ANDROID_KEYSTORE_BASE64: ${{ secrets.WOOSUITE_ANDROID_KEYSTORE_BASE64 }}
          WOOSUITE_ANDROID_STORE_PASSWORD: ${{ secrets.WOOSUITE_ANDROID_STORE_PASSWORD }}
          WOOSUITE_ANDROID_KEY_ALIAS: ${{ secrets.WOOSUITE_ANDROID_KEY_ALIAS }}
          WOOSUITE_ANDROID_KEY_PASSWORD: ${{ secrets.WOOSUITE_ANDROID_KEY_PASSWORD }}
          WOOSUITE_ANDROID_RELEASE_VERSION_CODE: ${{ inputs.release_code }}
          WOOSUITE_ANDROID_RELEASE_VERSION_NAME: ${{ inputs.release_version }}
          RELEASE_NAME: ${{ inputs.release_version }}
          RELEASE_CODE: ${{ inputs.release_code }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid versionCode"; exit 1; }
          [[ "$RELEASE_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid versionName"; exit 1; }
          test "$RELEASE_CODE" -ge 2030 || { echo "::error::Use Android versionCode at least 2024; v0.8.6 uses manifest code 2023"; exit 1; }
          python3 private-source/scripts/configure_android_release_signing.py app
          # Force Gradle to pick up signing secrets that were absent in test builds.
          (cd app/android && ./gradlew --stop >/dev/null)
          cd app
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --build-name="$RELEASE_NAME" --build-number="$RELEASE_CODE"
          python3 ../private-source/scripts/verify_android_release_signing.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --version-code "$RELEASE_CODE" --version-name "$RELEASE_NAME"
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk > app-arm64-v8a-release.apk.sha256

      - name: Publish permanently signed updateable ARM64 APK only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: WooSuite-Pro-Stable-Signed-${{ inputs.release_version }}-code${{ inputs.release_code }}
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore from build runner
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.signed_release == true }}
        shell: bash
        run: |
          rm -f app/android/app/woosuite-permanent-release.p12
